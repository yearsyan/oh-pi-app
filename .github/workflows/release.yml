name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-portable:
    name: Build Android and gateway binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Test gateway
        run: go test ./...

      - name: Build Linux and Windows gateway binaries
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p release

          targets=(
            "linux/amd64"
            "linux/arm64"
            "windows/amd64"
            "windows/arm64"
          )

          for target in "${targets[@]}"; do
            GOOS="${target%/*}"
            GOARCH="${target#*/}"
            suffix=""
            if [[ "$GOOS" == "windows" ]]; then
              suffix=".exe"
            fi
            output="release/ohpi-gateway-${VERSION}-${GOOS}-${GOARCH}${suffix}"

            echo "Building ${GOOS}/${GOARCH}"
            CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" \
              go build -trimpath -ldflags="-s -w -X main.version=${VERSION}" -o "$output" ./cmd/ohpi-gateway
            go version -m "$output"
          done

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: "12266719"

      - name: Install NDK and CMake
        run: sdkmanager "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-home-cache-cleanup: true

      - name: Restore Android signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PROPERTIES_BASE64: ${{ secrets.KEYSTORE_PROPERTIES_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PROPERTIES_BASE64"
          mkdir -p app/androidApp
          echo "$KEYSTORE_BASE64" | base64 -d > app/androidApp/pi-release.keystore
          echo "$KEYSTORE_PROPERTIES_BASE64" | base64 -d > app/keystore.properties

      - name: Build release APK
        working-directory: app
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ./gradlew :androidApp:assembleRelease -PversionName="$VERSION" --no-daemon --console=plain

      - name: Stage APK artifact
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cp app/androidApp/build/outputs/apk/release/androidApp-release.apk \
            "release/oh-pi-app-${VERSION}.apk"

      - name: Upload portable release artifacts
        uses: actions/upload-artifact@v6
        with:
          name: portable-release
          path: release/*
          if-no-files-found: error
          retention-days: 1

  build-windows-desktop:
    name: Build Windows desktop ZIP
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: "12266719"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-home-cache-cleanup: true

      - name: Build Windows desktop app image
        working-directory: app
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          .\gradlew.bat --configure-on-demand :desktopApp:createDistributable `
            "-PversionName=$version" --no-daemon --console=plain
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Stage Windows desktop ZIP
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          $source = Resolve-Path `
            "app\desktopApp\build\compose\binaries\main\app\io.github.yearsyan.ohpi"
          $releaseDir = New-Item -ItemType Directory -Force "release"
          $bundleName = "oh-pi-app-$version-windows-x64"
          $bundleDir = Join-Path $releaseDir.FullName $bundleName
          $zipPath = Join-Path $releaseDir.FullName "$bundleName.zip"

          Copy-Item -LiteralPath $source.Path -Destination $bundleDir -Recurse -Force

          $launcher = Join-Path $bundleDir "io.github.yearsyan.ohpi.exe"
          if (-not (Test-Path -LiteralPath $launcher -PathType Leaf)) {
            throw "Windows launcher is missing: $launcher"
          }

          Compress-Archive `
            -LiteralPath $bundleDir `
            -DestinationPath $zipPath `
            -CompressionLevel Optimal

          if (-not (Test-Path -LiteralPath $zipPath -PathType Leaf)) {
            throw "Windows desktop ZIP was not created: $zipPath"
          }

      - name: Upload Windows desktop release artifact
        uses: actions/upload-artifact@v6
        with:
          name: windows-desktop-release
          path: release/*.zip
          if-no-files-found: error
          retention-days: 1

  build-macos:
    name: Build, sign, and notarize macOS
    needs: build-portable
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Build macOS gateway binaries
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p release

          for arch in amd64 arm64; do
            output="release/ohpi-gateway-${VERSION}-darwin-${arch}"
            echo "Building darwin/${arch}"
            CGO_ENABLED=0 GOOS=darwin GOARCH="$arch" \
              go build -trimpath -ldflags="-s -w -X main.version=${VERSION}" -o "$output" ./cmd/ohpi-gateway
            go version -m "$output"
          done

      - name: Sign and notarize macOS artifacts
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          bash scripts/ci/sign-notarize-macos.sh release "$VERSION"

      - name: Upload signed macOS release artifacts
        uses: actions/upload-artifact@v6
        with:
          name: macos-release
          path: release/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish GitHub Release
    needs:
      - build-portable
      - build-windows-desktop
      - build-macos
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v7
        with:
          path: release
          merge-multiple: true

      - name: Generate checksums
        working-directory: release
        run: >-
          sha256sum
          oh-pi-app-*.apk
          oh-pi-app-*-windows-x64.zip
          ohpi-gateway-*
          > SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: release/*
          fail_on_unmatched_files: true
          generate_release_notes: true
