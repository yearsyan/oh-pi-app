name: Release Android APK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: |
          sdkmanager "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PROPERTIES_BASE64: ${{ secrets.KEYSTORE_PROPERTIES_BASE64 }}
        run: |
          mkdir -p app/androidApp
          echo "$KEYSTORE_BASE64" | base64 -d > app/androidApp/pi-release.keystore
          echo "$KEYSTORE_PROPERTIES_BASE64" | base64 -d > app/keystore.properties

      - name: Build release APK
        working-directory: app
        run: ./gradlew :androidApp:assembleRelease --no-daemon

      - name: Stage APK artifact
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cp app/androidApp/build/outputs/apk/release/androidApp-release.apk "pi-app-${VERSION}.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: pi-app-*.apk
          generate_release_notes: true
