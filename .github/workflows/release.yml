name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Test gateway
        run: go test ./...

      - name: Build gateway binaries
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p release

          targets=(
            "darwin/amd64"
            "darwin/arm64"
            "linux/amd64"
            "linux/arm64"
            "windows/amd64"
            "windows/arm64"
          )

          for target in "${targets[@]}"; do
            GOOS="${target%/*}"
            GOARCH="${target#*/}"
            suffix=""
            if [[ "$GOOS" == "windows" ]]; then
              suffix=".exe"
            fi
            output="release/ohpi-gateway-${VERSION}-${GOOS}-${GOARCH}${suffix}"

            echo "Building ${GOOS}/${GOARCH}"
            CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" \
              go build -trimpath -ldflags="-s -w -X main.version=${VERSION}" -o "$output" ./cmd/ohpi-gateway
            go version -m "$output"
          done

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: |
          sdkmanager "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PROPERTIES_BASE64: ${{ secrets.KEYSTORE_PROPERTIES_BASE64 }}
        run: |
          mkdir -p app/androidApp
          echo "$KEYSTORE_BASE64" | base64 -d > app/androidApp/pi-release.keystore
          echo "$KEYSTORE_PROPERTIES_BASE64" | base64 -d > app/keystore.properties

      - name: Build release APK
        working-directory: app
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ./gradlew :androidApp:assembleRelease -PversionName="$VERSION" --no-daemon --console=plain

      - name: Stage APK artifact
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cp app/androidApp/build/outputs/apk/release/androidApp-release.apk \
            "release/oh-pi-app-${VERSION}.apk"

      - name: Generate checksums
        working-directory: release
        run: sha256sum oh-pi-app-*.apk ohpi-gateway-* > SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          fail_on_unmatched_files: true
          generate_release_notes: true
