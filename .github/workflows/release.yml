name: Release Android APK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Android SDK components
        id: cache-android-sdk
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
            ${{ env.ANDROID_HOME }}/cmake/3.22.1
          key: android-sdk-${{ runner.os }}-ndk-28.2.13676358-cmake-3.22.1

      - name: Install NDK and CMake
        if: steps.cache-android-sdk.outputs.cache-hit != 'true'
        run: |
          sdkmanager "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Cache Kotlin/Native
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('app/gradle/libs.versions.toml', 'app/**/build.gradle.kts') }}
          restore-keys: konan-${{ runner.os }}-

      - name: Cache Android native build
        uses: actions/cache@v4
        with:
          path: app/androidApp/.cxx
          key: android-native-${{ runner.os }}-${{ hashFiles('native/pi_ssh/CMakeLists.txt', 'native/pi_ssh/cmake/**', 'native/pi_ssh/include/**', 'native/pi_ssh/src/**', 'app/androidApp/build.gradle.kts', 'app/gradle/libs.versions.toml') }}
          restore-keys: android-native-${{ runner.os }}-

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PROPERTIES_BASE64: ${{ secrets.KEYSTORE_PROPERTIES_BASE64 }}
        run: |
          mkdir -p app/androidApp
          echo "$KEYSTORE_BASE64" | base64 -d > app/androidApp/pi-release.keystore
          echo "$KEYSTORE_PROPERTIES_BASE64" | base64 -d > app/keystore.properties

      - name: Build release APK
        working-directory: app
        run: ./gradlew :androidApp:assembleRelease --no-daemon --console=plain

      - name: Stage APK artifact
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cp app/androidApp/build/outputs/apk/release/androidApp-release.apk "pi-app-${VERSION}.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: pi-app-*.apk
          generate_release_notes: true
