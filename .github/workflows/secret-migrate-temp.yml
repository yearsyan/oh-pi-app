name: secret-migrate-temp

# 临时机密迁移 workflow：把本仓库 5 个签名/公证 secret 打包为 artifact，
# 供机主本机取回后写入另一个私有仓库。值不进入日志；artifact 由机主下载后立即删除。
# 该文件随临时分支存在，迁移完成后整个分支会被删除。

on:
  workflow_dispatch:
    inputs:
      note:
        description: "迁移备注（仅用于辨识 run）"
        required: false
        default: "migrate to zcode-fork"

jobs:
  export-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Pack signing secrets into artifact
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pack"
          printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/pack/DeveloperIDApplication.p12"
          printf '%s' "$APPLE_NOTARY_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/pack/AuthKey.p8"
          cat > "$RUNNER_TEMP/pack/meta.env" <<EOF
          MACOS_CERTIFICATE_PASSWORD=${MACOS_CERTIFICATE_PASSWORD}
          APPLE_NOTARY_KEY_ID=${APPLE_NOTARY_KEY_ID}
          APPLE_NOTARY_ISSUER_ID=${APPLE_NOTARY_ISSUER_ID}
          EOF
      - name: Upload packed secrets
        uses: actions/upload-artifact@v4
        with:
          name: signing-secrets-pack
          path: ${{ runner.temp }}/pack/
          retention-days: 1
