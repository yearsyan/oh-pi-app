name: TestFlight

on:
  workflow_dispatch:
    inputs:
      version:
        description: >-
          iOS marketing version (for example, 1.10.7). Leave empty to use the
          most recent v* tag.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: testflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  upload:
    name: Build and upload iOS to TestFlight
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify managed installer contract
        shell: bash
        run: |
          set -euo pipefail
          sh -n scripts/install.sh
          expected="$(sed -n '/internal const val UnixManagedInstallerSha256/{n;s/.*"\([0-9a-f]\{64\}\)".*/\1/p;}' \
            app/shared/src/commonMain/kotlin/io/github/yearsyan/ohpi/net/ManagedGateway.kt)"
          actual="$(shasum -a 256 scripts/install.sh | awk '{print $1}')"
          test -n "$expected"
          test "$actual" = "$expected"

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Validate Apple build tools
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          cmake --version
          java -version

      - name: Archive and upload to TestFlight
        env:
          IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_APP_STORE_PROFILE_BASE64: ${{ secrets.IOS_APP_STORE_PROFILE_BASE64 }}
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [[ -n "$VERSION_INPUT" ]]; then
            version="$VERSION_INPUT"
          else
            version="$(git describe --tags --abbrev=0 --match 'v*' | sed 's/^v//')"
          fi

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "iOS version must use major.minor.patch: ${version}" >&2
            exit 1
          fi

          build_number="${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          bash scripts/ci/upload-testflight.sh "$version" "$build_number"
